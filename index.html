<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8200">
<title>Tennessee Rosters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --orange:#ff8200;
    --ink:#232323;
    --smokey:#66686b;
    --rule:#e4e4e2;
    --paper:#ffffff;
    --wash:#f6f6f4;
    --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;}

  header{position:sticky;top:0;z-index:20;background:var(--paper);padding:12px 16px 0;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--rule);}
  .masthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
  h1{font-family:var(--num);font-weight:700;font-size:29px;margin:0;line-height:1;}
  .season{font-family:var(--num);font-size:29px;font-weight:600;color:var(--orange);line-height:1;white-space:nowrap;}

  .sports{display:flex;background:var(--wash);border-radius:9px;padding:3px;margin-bottom:10px;}
  .sport{flex:1;font-family:var(--num);font-size:17px;font-weight:600;letter-spacing:.02em;white-space:nowrap;
         padding:7px 4px;border:0;border-radius:7px;background:transparent;color:var(--smokey);cursor:pointer;}
  .sport[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 0 0 1.5px var(--orange) inset;}

  .search{position:relative;margin-bottom:10px;}
  #q{width:100%;font-family:var(--body);font-size:16px;padding:11px 40px 11px 13px;border:1.5px solid var(--rule);border-radius:8px;background:var(--wash);color:var(--ink);}
  #q:focus{outline:none;border-color:var(--orange);background:#fff;}
  #clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--smokey);font-size:20px;line-height:1;padding:6px 9px;cursor:pointer;display:none;}
  #clear.on{display:block;}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:11px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;font-family:var(--num);font-size:16px;font-weight:600;letter-spacing:.02em;padding:5px 12px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;color:var(--smokey);cursor:pointer;}
  .chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff;}
  .chip:focus-visible,.sport:focus-visible,.tab:focus-visible,#q:focus-visible,.row:focus-visible,select:focus-visible,#clear:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}

  .checker{height:10px;background-color:#fff;
    background-image:linear-gradient(45deg,var(--orange) 25%,transparent 25%,transparent 75%,var(--orange) 75%),
                     linear-gradient(45deg,var(--orange) 25%,transparent 25%,transparent 75%,var(--orange) 75%);
    background-size:20px 20px;background-position:0 0,10px 10px;}
  .tabs{display:flex;border-bottom:1px solid var(--rule);background:#fff;}
  .tab{flex:1;font-family:var(--num);font-size:18px;font-weight:600;letter-spacing:.02em;padding:10px 8px;background:#fff;border:0;border-bottom:3px solid transparent;color:var(--smokey);cursor:pointer;}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange);}

  .statusbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 16px;background:var(--wash);border-bottom:1px solid var(--rule);font-size:13.5px;color:var(--smokey);}
  .statusbar select{font-family:var(--body);font-size:13.5px;color:var(--ink);border:1px solid var(--rule);border-radius:6px;background:#fff;padding:4px 6px;}

  /* view switching */
  body.view-depth .search,body.view-depth .chips,body.view-depth .statusbar,body.view-depth #list{display:none;}
  #depth{display:none;padding:0 0 40px;}
  body.view-depth #depth{display:block;}
  body.view-schedule .search,body.view-schedule .chips,body.view-schedule .statusbar,body.view-schedule #list{display:none;}
  #sched{display:none;padding:0 0 40px;}
  body.view-schedule #sched{display:block;}
  .record{display:flex;align-items:baseline;gap:14px;padding:14px 16px;border-bottom:1px solid var(--rule);background:var(--wash);}
  .record b{font-family:var(--num);font-size:30px;font-weight:700;line-height:1;}
  .record span{font-size:13.5px;color:var(--smokey);}
  .month{font-family:var(--num);font-size:19px;font-weight:700;margin:0;padding:14px 16px 6px;letter-spacing:.02em;}
  .games{padding:0;}
  .game{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);}
  .gdate{text-align:center;line-height:1.05;}
  .gday{display:block;font-family:var(--num);font-size:24px;font-weight:700;}
  .gdow{display:block;font-size:11.5px;color:var(--smokey);}
  .gopp{display:block;font-size:16px;font-weight:600;line-height:1.25;}
  .ha{font-weight:400;color:var(--smokey);margin-right:3px;}
  .gmeta{display:block;font-size:13px;color:var(--smokey);}
  .gtag{display:inline-block;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:4px;border:1px solid var(--rule);color:var(--smokey);vertical-align:2px;margin-left:4px;white-space:nowrap;}
  .gtag.conf{border-color:#f6c9a3;color:#a64b00;}
  .gres{font-family:var(--num);font-size:19px;font-weight:700;white-space:nowrap;text-align:right;}
  .gres.w{color:var(--ink);} .gres.w i{color:var(--orange);font-style:normal;}
  .gres.l{color:var(--smokey);font-weight:600;}
  .game.next{background:#fff6ec;box-shadow:inset 4px 0 0 var(--orange);}
  .nextlbl{font-family:var(--num);font-size:15px;font-weight:700;color:var(--orange);}
  .game.bye .gopp{color:var(--smokey);font-weight:500;}

  ul{list-style:none;margin:0;padding:0 0 40px;}
  li{border-bottom:1px solid var(--rule);}
  .row{display:block;width:100%;padding:11px 16px;background:#fff;border:0;text-align:left;cursor:pointer;font-family:var(--body);color:inherit;}
  .rowinner{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;}
  .jersey{font-family:var(--num);font-weight:700;font-size:31px;line-height:1;color:var(--orange);text-align:right;font-variant-numeric:tabular-nums;}
  .who{min-width:0;overflow:hidden;}
  .name{display:block;font-size:16.5px;font-weight:600;line-height:1.25;}
  .sub{display:block;font-size:13px;color:var(--smokey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .posbox{text-align:right;}
  .pos{display:inline-block;font-family:var(--num);font-size:17px;font-weight:600;color:var(--ink);background:var(--wash);border-radius:5px;padding:3px 8px;letter-spacing:.02em;}
  .role{display:block;margin-top:3px;font-size:11px;line-height:1.1;color:var(--smokey);white-space:nowrap;}
  .detail{display:none;padding:2px 16px 15px 72px;background:#fff;font-size:14.5px;}
  li.open .detail{display:block;}
  li.open .row{background:var(--wash);}
  li.open .pos{background:#fff;}
  .detail dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;}
  .detail dt{color:var(--smokey);font-size:13px;}
  .detail dd{margin:0;}
  .rank{color:var(--smokey);font-size:12.5px;}
  .say{display:inline-block;margin-bottom:8px;font-size:14px;border-left:3px solid var(--orange);padding-left:9px;}
  .flag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;vertical-align:2px;
        padding:1px 6px;border-radius:4px;background:var(--wash);color:var(--smokey);border:1px solid var(--rule);}
  .flag.out{background:#fdece0;border-color:#f6c9a3;color:#a64b00;}
  .empty{padding:44px 24px;text-align:center;color:var(--smokey);}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px;font-weight:600;}

  .unit h2{font-family:var(--num);font-size:22px;font-weight:700;margin:0;padding:12px 16px 8px;background:var(--wash);border-bottom:1px solid var(--rule);letter-spacing:.02em;}
  .unit .lede{margin:0;padding:10px 16px;font-size:13px;color:var(--smokey);border-bottom:1px solid var(--rule);}
  .spot{padding:11px 16px;border-bottom:1px solid var(--rule);}
  .spot h3{font-size:13px;font-weight:600;color:var(--smokey);margin:0 0 5px;letter-spacing:.02em;}
  .spot ol{list-style:none;margin:0;padding:0;}
  .spot li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:baseline;border:0;padding:2px 0;font-size:15px;}
  .spot li.starter{font-weight:600;}
  .dnum{font-family:var(--num);font-weight:700;font-size:19px;color:var(--orange);text-align:right;font-variant-numeric:tabular-nums;}
  .dnote{display:block;font-size:12.5px;font-weight:400;color:var(--smokey);line-height:1.3;}
  .drank{font-size:12px;color:var(--smokey);white-space:nowrap;}
  .asof{padding:14px 16px 0;margin:0;font-size:12.5px;color:var(--smokey);}

  footer{padding:18px 16px calc(28px + env(safe-area-inset-bottom));font-size:12.5px;color:var(--smokey);border-top:1px solid var(--rule);}
  footer p{margin:0 0 9px;}
  @media (prefers-reduced-motion:no-preference){ .row,.sport{transition:background .12s ease;} }
</style>
</head>

    rankDepth:["Starter","2nd team","3rd team","4th team","5th team"],
    noSpot:"No specific spot listed on the two-deep",
    depthNote:"Players out for the season have been removed from their spot; everyone below them moves up.",
    updated:FB_UPDATED, sched:FB_SCHED, conf:"SEC",
    footer:`<p><b>Roster updated:</b> ${FB_UPDATED.roster} &middot; <b>Depth chart updated:</b> ${FB_UPDATED.depth}</p>
      <p>Tap a player for hometown, high school, previous schools and where he lines up.
      Class: Fr. first year &middot; So. second &middot; Jr. third &middot; Sr. fourth &middot; 5th fifth.</p>
      <p>Players, numbers and hometowns come from the 2026 UT roster on utsports.com. Specific spots (corner vs. safety,
      guard vs. tackle) start from the Ourlads two-deep of Aug. 24, 2026, adjusted for season-ending injuries and
      lineup changes. George MacIntyre has started the last three games and stays first at quarterback.
      Tags reflect the South Carolina availability report and news through the Oct. 31 bye week; the Kentucky report comes out Nov. 4.
      The chart lists only the top few at each spot, so anyone deeper down shows just his position group.</p>`
  },
  mens:{
    title:"Vols Basketball", season:"2026-27",
    players: MBB_RAW.map(r => {
      const name = r[1], st = MBB_STATUS[name] || null, dp = mbbDepth[name] || [];
      return {num:r[0], name, pos:r[2], cl:r[3], yr:r[4], ht:r[5], inches:inchesOf(r[5]), wt:r[6],
        home:r[7], hs:r[8], prev:r[9] ? r[9].split("/") : [], last:lastName(name),
        say:"", note:MBB_NOTE[name]||"", posName:BB_POS[r[2]], depth:dp, status:st,
        short: dp.length ? dp[0].short : BB_POS[r[2]],
        hay:(r[0]+" #"+r[0]+" "+name+" "+r[2]+" "+BB_POS[r[2]]+" "+dp.map(d => d.full).join(" ")+" "+
             statusText(st)+" "+r[3]+" "+r[5]+" "+r[6]+" "+r[7]+" "+r[8]+" "+r[9]).toLowerCase()};
    }),
    chips:[["all","All"],["G","Guards"],["F","Forwards"],["C","Centers"]],
    match:(p,f) => f === "all" || p.pos === f,
    posOrder:BB_ORDER, hasWeight:true,
    depthRows:MBB_DEPTH,
    units:[["Projected lineup", ["Point guard","Shooting guard","Small forward","Power forward","Center"]]],
    unitLede:"Starters from the Xavier exhibition. Tennessee lost both exhibitions (Xavier 86-70, at Duke 103-64), and Terrence Hill Jr. hurt his ankle at Duke. Barnes says about 10 players are close and the lineup could change every game. Order behind each starter is a projection.",
    rankDetail:["Projected starter","Backup","3rd","4th"],
    rankDepth:["Starter","Backup","3rd","4th"],
    noSpot:"Not in the projected rotation",
    depthNote:"",
    updated:MBB_UPDATED, sched:MBB_SCHED, conf:"SEC",
    footer:`<p><b>Roster updated:</b> ${MBB_UPDATED.roster} &middot; <b>Depth chart updated:</b> ${MBB_UPDATED.depth}</p>
      <p>Tap a player for hometown, high school, previous schools and years at UT. Class: 5th and 6th are extra years of eligibility.</p>
      <p>Roster from utsports.com. Head coach Rick Barnes, 12th season. Assistants: Earl Grant, Bryan Lentz, Steve McClain,
      Amorrow Morgan and Gregg Polinsky. Basketball has no official depth chart; starters come from preseason reporting.</p>`
  },
  womens:{
    title:"Lady Vols", season:"2026-27",
    players: WBB_RAW.map(r => {
      const name = r[1], st = WBB_STATUS[name] || null, dp = wbbDepth[name] || [];
      return {num:r[0], name, pos:r[2], cl:r[3], yr:"", ht:r[4], inches:inchesOf(r[4]), wt:null,
        home:r[5], hs:r[6], prev:r[7] ? r[7].split("/") : [], last:lastName(name),
        say:"", note:WBB_NOTE[name]||"", posName:BB_POS[r[2]], depth:dp, status:st,
        short: dp.length ? dp[0].short : (st && st.spot) || BB_POS[r[2]],
        hay:(r[0]+" #"+r[0]+" "+name+" "+r[2]+" "+BB_POS[r[2]]+" "+dp.map(d => d.full).join(" ")+" "+
             statusText(st)+" "+r[3]+" "+r[4]+" "+r[5]+" "+r[6]+" "+r[7]).toLowerCase()};
    }),
    chips:[["all","All"],["G","Guards"],["F","Forwards"]],
    match:(p,f) => f === "all" || p.pos === f || p.pos === "G/F",
    posOrder:BB_ORDER, hasWeight:false,
    depthRows:WBB_DEPTH,
    units:[["Projected rotation", ["Point guard","Guard","Forward"]]],
    unitLede:"Starters are the five who opened the Oct. 17 open scrimmage, a 109-79 win over the men's scout team. Everyone else is grouped by role and roughly ordered by expected minutes. Caldwell's up-tempo system usually plays 10 or more.",
    starters:WBB_STARTERS,
    rankDetail:["","","","","",""],
    rankDepth:["","","","","",""],
    noSpot:"Not in the projected rotation",
    depthNote:"",
    updated:WBB_UPDATED, sched:WBB_SCHED, conf:"SEC",
    footer:`<p><b>Roster updated:</b> ${WBB_UPDATED.roster} &middot; <b>Depth chart updated:</b> ${WBB_UPDATED.depth}</p>
      <p>Tap a player for hometown, high school, previous schools and a quick note on her game. UT doesn't list weights for the Lady Vols.</p>
      <p>Roster from utsports.com. Head coach Kim Caldwell, 3rd season. Assistants: Bill Ferrara, Isoken Uzamere, Jenna Burdette,
      Angel Rizor and Lexie Barrier. Player notes come from Knox News' Oct. 8 preview of all 15 newcomers.</p>`
  }
};

/* =====================================================================
   APP
   ===================================================================== */
const $ = id => document.getElementById(id);
const qEl = $("q"), clearEl = $("clear"), listEl = $("list"), countEl = $("count"),
      sortEl = $("sort"), chipsEl = $("chips"), depthEl = $("depth");
let sport = "football", view = "roster", filter = "all";

function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function isOut(tag){ return /^(Out|Likely out)/.test(tag); }
function flag(st){ return st ? ` <span class="flag${isOut(st.tag) ? " out" : ""}">${esc(st.tag)}</span>` : ""; }

function buildChips(){
  const S = SPORTS[sport];
  chipsEl.innerHTML = "";
  S.chips.forEach(([v,l]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = l; b.dataset.pos = v;
    b.setAttribute("aria-pressed", v === filter);
    b.addEventListener("click", () => {
      filter = v;
      [...chipsEl.children].forEach(c => c.setAttribute("aria-pressed", c.dataset.pos === v));
      render();
    });
    chipsEl.appendChild(b);
  });
}

function buildSort(){
  const S = SPORTS[sport], keep = sortEl.value;
  const opts = [["num","Number"],["name","Last name"],["pos","Position"]]
    .concat(S.hasWeight ? [["wt","Heaviest"]] : [], [["ht","Tallest"],["cl","Class"]]);
  sortEl.innerHTML = opts.map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
  sortEl.value = opts.some(o => o[0] === keep) ? keep : "num";
}

function render(){
  const S = SPORTS[sport];
  const q = qEl.value.trim().toLowerCase();
  clearEl.classList.toggle("on", q.length > 0);
  const jersey = q.match(/^#?(\d{1,2})$/);
  let rows;
  if (jersey){
    rows = S.players.filter(p => S.match(p, filter) && p.num === Number(jersey[1]));
    if (!rows.length) rows = S.players.filter(p => S.match(p, filter) && p.hay.includes(q));
  } else {
    rows = S.players.filter(p => S.match(p, filter) && (!q || p.hay.includes(q)));
  }
  const s = sortEl.value;
  rows.sort((a,b) => {
    if (s === "name") return a.last.localeCompare(b.last) || a.name.localeCompare(b.name);
    if (s === "wt")   return (b.wt||0) - (a.wt||0);
    if (s === "ht")   return b.inches - a.inches || (b.wt||0) - (a.wt||0);
    if (s === "cl")   return (CLASS_ORDER[b.cl]||0) - (CLASS_ORDER[a.cl]||0) || a.num - b.num;
    if (s === "pos")  return S.posOrder.indexOf(a.pos) - S.posOrder.indexOf(b.pos) || a.num - b.num;
    return a.num - b.num || a.name.localeCompare(b.name);
  });
  countEl.textContent = rows.length === 1 ? "1 player" : rows.length + " players";

  if (!rows.length){
    listEl.innerHTML = '<li><div class="empty"><b>No one by that name</b>Try a jersey number, a position, or a hometown.</div></li>';
    return;
  }
  listEl.innerHTML = rows.map((p,i) => {
    const plays = p.depth.length
      ? p.depth.map(d => esc(d.full) + (S.rankDetail[d.rank-1] ? ' <span class="rank">' + S.rankDetail[d.rank-1] + '</span>' : "")).join("<br>")
      : (p.status && p.status.spot ? esc(p.status.spot) + ' <span class="rank">before the injury</span>' : S.noSpot);
    return `
    <li>
      <button class="row" type="button" aria-expanded="false" aria-controls="d${i}">
       <span class="rowinner">
        <span class="jersey">${p.num}</span>
        <span class="who">
          <span class="name">${esc(p.name)}${flag(p.status)}</span>
          <span class="sub">${esc(p.cl)} &nbsp;&middot;&nbsp; ${esc(p.ht)}${p.wt ? ", " + p.wt : ""} &nbsp;&middot;&nbsp; ${esc(p.home)}</span>
        </span>
        <span class="posbox">
          <span class="pos">${esc(p.pos)}</span>
          <span class="role">${esc(p.short)}</span>
        </span>
       </span>
      </button>
      <div class="detail" id="d${i}">
        ${p.say ? `<div class="say">Say it: ${esc(p.say)}</div>` : ""}
        <dl>
          ${p.status ? `<dt>Status</dt><dd>${esc(p.status.tag)}: ${esc(p.status.note)}</dd>` : ""}
          <dt>Position</dt><dd>${esc(p.posName)}</dd>
          <dt>Plays</dt><dd>${plays}</dd>
          ${p.note ? `<dt>Note</dt><dd>${esc(p.note)}</dd>` : ""}
          <dt>Hometown</dt><dd>${esc(p.home)}</dd>
          ${p.hs ? `<dt>High school</dt><dd>${esc(p.hs)}</dd>` : ""}
          ${p.prev.length ? `<dt>Came from</dt><dd>${esc(p.prev.join(", "))}</dd>` : ""}
          ${p.yr ? `<dt>Year at UT</dt><dd>${esc(p.yr)}</dd>` : ""}
        </dl>
      </div>
    </li>`;
  }).join("");
  listEl.querySelectorAll(".row").forEach(btn => btn.addEventListener("click", () => {
    const open = btn.parentElement.classList.toggle("open");
    btn.setAttribute("aria-expanded", open);
  }));
}

function renderDepth(){
  const S = SPORTS[sport];
  const byName = {}; S.players.forEach(p => byName[p.name] = p);
  const rowFor = short => S.depthRows.find(r => r[0] === short) || [null,null,[]];
  depthEl.innerHTML = S.units.map(([unit, spots]) => {
    const blocks = spots.map(short => {
      const [, full, names] = rowFor(short);
      if (!names.length) return "";
      const men = names.map((n,i) => {
        const p = byName[n];
        const note = p && p.note && sport !== "football" ? `<span class="dnote">${esc(p.note)}</span>` : "";
        const showStarter = S.starters ? S.starters.includes(n) : (S.rankDepth[0] !== "" && i === 0);
        return `<li${showStarter ? ' class="starter"' : ""}>
            <span class="dnum">${p ? p.num : ""}</span>
            <span class="dname">${esc(n)}${p ? flag(p.status) : ""}${note}</span>
            <span class="drank">${S.starters ? (showStarter ? "Starter" : "") : (S.rankDepth[i] || "")}</span>
          </li>`;
      }).join("");
      return `<div class="spot"><h3>${esc(full || short)}</h3><ol>${men}</ol></div>`;
    }).join("");
    return `<section class="unit"><h2>${esc(unit)}</h2>${S.unitLede ? `<p class="lede">${esc(S.unitLede)}</p>` : ""}${blocks}</section>`;
  }).join("") + `<p class="asof">Depth chart as of ${esc(S.updated.depth)}. ${esc(S.depthNote)}</p>`;
}

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function renderSched(){
  const S = SPORTS[sport];
  const today = new Date(); today.setHours(0,0,0,0);
  const games = S.sched.map(g => {
    const [y,m,d] = g[0].split("-").map(Number);
    return {date:new Date(y,m-1,d), opp:g[1], ha:g[2], site:g[3], time:g[4], tv:g[5], res:g[6], tag:g[7]};
  });
  const counted = games.filter(g => g.res && g.tag !== "Exhibition");
  const wins = counted.filter(g => g.res[0] === "W").length, losses = counted.length - wins;
  const conf = counted.filter(g => g.tag === S.conf);
  const cw = conf.filter(g => g.res[0] === "W").length;
  const next = games.find(g => !g.res && g.ha && g.date >= today);
  let head;
  if (counted.length){
    head = `<b>${wins}-${losses}</b><span>${conf.length ? cw + "-" + (conf.length - cw) + " " + S.conf + "<br>" : ""}${games.filter(g=>g.ha).length - games.filter(g=>g.res).length} games left</span>`;
  } else {
    const first = games.find(g => g.ha && g.tag !== "Exhibition");
    head = `<b>0-0</b><span>Season opens ${DOW[first.date.getDay()]}, ${MONTHS[first.date.getMonth()].slice(0,3)}. ${first.date.getDate()} vs. ${esc(first.opp)}</span>`;
  }
  let html = `<div class="record">${head}</div>`, lastMonth = -1;
  games.forEach(g => {
    const mo = g.date.getMonth();
    if (mo !== lastMonth){
      if (lastMonth !== -1) html += "</ul>";
      html += `<h3 class="month">${MONTHS[mo]}</h3><ul class="games">`;
      lastMonth = mo;
    }
    const isNext = g === next;
    const ha = g.ha === "H" ? "vs." : g.ha === "A" ? "at" : g.ha === "N" ? "vs." : "";
    const meta = g.res ? [g.site] : [g.site, g.time, g.tv];
    const tag = g.tag ? `<span class="gtag${g.tag === S.conf ? " conf" : ""}">${esc(g.tag)}</span>` : "";
    const res = g.res
      ? `<span class="gres ${g.res[0] === "W" ? "w" : "l"}">${g.res[0] === "W" ? "<i>W</i>" : "L"} ${esc(g.res.slice(2))}</span>`
      : (isNext ? `<span class="nextlbl">Next</span>` : "");
    html += `<li class="game${isNext ? " next" : ""}${g.ha ? "" : " bye"}">
      <span class="gdate"><span class="gday">${g.date.getDate()}</span><span class="gdow">${DOW[g.date.getDay()]}</span></span>
      <span><span class="gopp">${ha ? `<span class="ha">${ha}</span>` : ""}${esc(g.opp)}${tag}</span>
        ${g.ha ? `<span class="gmeta">${meta.filter(Boolean).map(esc).join(" &middot; ")}${g.ha === "N" ? " (neutral)" : ""}</span>` : ""}</span>
      ${res}
    </li>`;
  });
  html += "</ul>";
  html += `<p class="asof">All times Eastern. TBA times and TV are set later in the season. Schedule from utsports.com.</p>`;
  $("sched").innerHTML = html;
}

function show(newSport, newView, push){
  const changedSport = newSport !== sport;
  sport = newSport; view = newView;
  const S = SPORTS[sport];
  if (changedSport){ filter = "all"; qEl.value = ""; }
  $("title").textContent = S.title;
  $("season").textContent = S.season;
  document.querySelectorAll(".sport").forEach(b => b.setAttribute("aria-selected", b.dataset.sport === sport));
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  document.body.classList.toggle("view-depth", view === "depth");
  document.body.classList.toggle("view-schedule", view === "schedule");
  $("foot").innerHTML = S.footer;
  buildChips(); buildSort(); render(); renderDepth(); renderSched();
  if (push){
    try { history.replaceState(null, "", "#" + sport + (view === "roster" ? "" : "/" + view)); } catch(e){}
    try { localStorage.setItem("utRosterSport", sport); } catch(e){}
    window.scrollTo(0,0);
  }
}

document.querySelectorAll(".sport").forEach(b => b.addEventListener("click", () => show(b.dataset.sport, view, true)));
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => show(sport, b.dataset.view, true)));
qEl.addEventListener("input", render);
sortEl.addEventListener("change", render);
clearEl.addEventListener("click", () => { qEl.value = ""; qEl.focus(); render(); });

(function start(){
  const h = (location.hash || "").replace("#","").split("/");
  let s = SPORTS[h[0]] ? h[0] : null;
  if (!s){ try { const saved = localStorage.getItem("utRosterSport"); if (SPORTS[saved]) s = saved; } catch(e){} }
  show(s || "football", ["depth","schedule"].includes(h[1]) ? h[1] : "roster", false);
})();
</script>
</body>
